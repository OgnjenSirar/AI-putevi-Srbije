name: Deploy demo

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      reset_demo:
        description: "Vrati demo bazu na pocetno stanje posle deploy-a"
        type: boolean
        default: false

concurrency:
  group: deploy-putevi-kc
  cancel-in-progress: false

env:
  COMPOSE_PROJECT_NAME: putevi-kc

jobs:
  deploy:
    # Labela runnera registrovanog za ovaj repozitorijum na demo serveru
    runs-on: [self-hosted, putevi-demo]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Provera preduslova
        run: |
          # Trajna konfiguracija na serveru, van radnog direktorijuma runnera
          CFG="${{ vars.CONFIG_DIR }}"
          echo "CONFIG_DIR=${CFG:-$HOME/putevi-kc-config}" >> "$GITHUB_ENV"
          docker version --format 'Docker {{.Server.Version}}'
          docker compose version
          if command -v nvidia-smi >/dev/null; then
            nvidia-smi --query-gpu=name,memory.total,memory.used --format=csv
          else
            echo "UPOZORENJE: nvidia-smi nije pronadjen"
          fi
          if curl -fsS --max-time 5 http://127.0.0.1:11434/api/version; then
            echo
          else
            echo "UPOZORENJE: Ollama ne odgovara na 127.0.0.1:11434, AI ce raditi u rezervnom rezimu"
          fi
          df -h / | tail -1

      - name: Priprema .env
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          DEMO_HOST: ${{ vars.DEMO_HOST }}
          WEB_PORT: ${{ vars.WEB_PORT }}
          OLLAMA_BASE_MODEL: ${{ vars.OLLAMA_BASE_MODEL }}
          LANGFUSE_HOST: ${{ vars.LANGFUSE_HOST }}
          LANGFUSE_UI_URL: ${{ vars.LANGFUSE_UI_URL }}
          LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
          LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
        run: |
          mkdir -p "$CONFIG_DIR"
          ENVF="$CONFIG_DIR/.env"
          set_env() {  # postavi ili dodaj KLJUC=vrednost
            if grep -q "^$1=" "$ENVF"; then sed -i "s|^$1=.*|$1=$2|" "$ENVF"; else echo "$1=$2" >> "$ENVF"; fi
          }
          if [ ! -f "$ENVF" ]; then
            cp .env.example "$ENVF"
            rnd() { openssl rand -hex "$1"; }
            set_env POSTGRES_PASSWORD "$(rnd 16)"
            set_env SECRET_KEY "$(rnd 32)"
            set_env LANGFUSE_NEXTAUTH_SECRET "$(rnd 32)"
            set_env LANGFUSE_SALT "$(rnd 16)"
            set_env LANGFUSE_ENCRYPTION_KEY "$(rnd 32)"
            set_env LANGFUSE_INIT_USER_PASSWORD "$(rnd 8)"
            set_env CLICKHOUSE_PASSWORD "$(rnd 12)"
            set_env MINIO_PASSWORD "$(rnd 12)"
            set_env REDIS_PASSWORD "$(rnd 12)"
            echo "Napravljen $ENVF sa nasumicnim lozinkama"
          fi
          # Kljucevi koji nedostaju u starijem .env dobijaju vrednost iz .env.example
          grep -E '^[A-Z_]+=' .env.example | while IFS= read -r line; do
            k="${line%%=*}"; grep -q "^$k=" "$ENVF" || echo "$line" >> "$ENVF"
          done
          # Vrednosti iz GitHub podesavanja uvek imaju prednost
          for k in HF_TOKEN DEMO_HOST WEB_PORT OLLAMA_BASE_MODEL LANGFUSE_HOST LANGFUSE_UI_URL LANGFUSE_PUBLIC_KEY LANGFUSE_SECRET_KEY; do
            v="${!k}"
            [ -n "$v" ] && set_env "$k" "$v"
          done
          chmod 600 "$ENVF"
          grep -E '^(DEMO_HOST|WEB_PORT|AI_MODE|LLM_BASE_URL|LLM_SERVED_NAME|OLLAMA_BASE_MODEL|LANGFUSE_HOST)=' "$ENVF"
          if grep -q '^LANGFUSE_PUBLIC_KEY=.\+' "$ENVF"; then echo "Langfuse tragovi: ukljuceni"; else echo "Langfuse tragovi: iskljuceni (nema kljuceva)"; fi

      - name: Provera porta
        run: |
          PORT=$(grep -E '^WEB_PORT=' "$CONFIG_DIR/.env" | cut -d= -f2)
          PORT=${PORT:-8090}
          OURS=$(docker compose --env-file "$CONFIG_DIR/.env" ps -q web 2>/dev/null || true)
          if [ -z "$OURS" ] && ss -ltnH "sport = :$PORT" | grep -q .; then
            echo "GRESKA: port $PORT je vec zauzet na serveru (drugi projekat). Promeniti promenljivu WEB_PORT."
            ss -ltnp "sport = :$PORT" || true
            exit 1
          fi
          echo "Port $PORT je slobodan ili ga vec koristi ovaj projekat"

      - name: Build
        run: docker compose --env-file "$CONFIG_DIR/.env" build --pull

      - name: Pokretanje
        run: docker compose --env-file "$CONFIG_DIR/.env" up -d --remove-orphans

      - name: Cekanje da aplikacija proradi
        run: |
          PORT=$(grep -E '^WEB_PORT=' "$CONFIG_DIR/.env" | cut -d= -f2)
          for i in $(seq 1 60); do
            if curl -fsS "http://localhost:${PORT:-8090}/api/health" >/dev/null; then echo "Aplikacija radi"; exit 0; fi
            sleep 5
          done
          docker compose --env-file "$CONFIG_DIR/.env" logs --tail=80 api worker web
          exit 1

      - name: Priprema jezickog modela u Ollama
        timeout-minutes: 45
        run: |
          # ollama-init preuzima model jednom (nekoliko GB), sledeci deploy-i traju par sekundi
          CID=$(docker compose --env-file "$CONFIG_DIR/.env" ps -aq ollama-init)
          while [ "$(docker inspect -f '{{.State.Status}}' "$CID")" = "running" ]; do sleep 10; done
          docker logs "$CID"
          exit "$(docker inspect -f '{{.State.ExitCode}}' "$CID")"

      - name: Reset demo baze
        if: ${{ github.event.inputs.reset_demo == 'true' }}
        run: |
          docker compose --env-file "$CONFIG_DIR/.env" exec -T api python -c "from app.seed.seed import reset_database, seed_all; from app.db import SessionLocal; from app.seed.social_examples import seed_social_examples; reset_database(); db=SessionLocal(); print(seed_all(db)); seed_social_examples()"

      - name: Stanje servisa
        if: always()
        run: |
          docker compose --env-file "$CONFIG_DIR/.env" ps
          echo "Embedding, reranker i model za slike se pri prvom pokretanju preuzimaju sa Hugging Face-a (oko 20 GB),"
          echo "pa mogu biti spremni tek posle nekoliko minuta. Stanje se vidi u aplikaciji, Administracija, Stanje sistema."

      - name: Ciscenje starih slika ovog projekta
        if: success()
        run: docker image prune -f --filter "label=com.docker.compose.project=putevi-kc"
