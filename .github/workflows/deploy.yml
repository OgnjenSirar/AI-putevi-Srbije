name: Deploy demo

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      reset_demo:
        description: "Vrati demo bazu na pocetno stanje posle deploy-a"
        type: boolean
        default: false

concurrency:
  group: deploy-putevi-kc
  cancel-in-progress: false

env:
  COMPOSE_PROJECT_NAME: putevi-kc

jobs:
  deploy:
    # Labela runnera registrovanog za ovaj repozitorijum na demo serveru
    runs-on: [self-hosted, putevi-demo]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Provera preduslova
        run: |
          # Trajna konfiguracija na serveru, van radnog direktorijuma runnera
          CFG="${{ vars.CONFIG_DIR }}"
          echo "CONFIG_DIR=${CFG:-$HOME/putevi-kc-config}" >> "$GITHUB_ENV"
          docker version --format 'Docker {{.Server.Version}}'
          docker compose version
          if command -v nvidia-smi >/dev/null; then
            nvidia-smi --query-gpu=name,memory.total,memory.used --format=csv | tee pre.log
          else
            echo "nvidia-smi nije pronadjen" | tee pre.log
          fi
          # Generisanje slika trazi GPU u Docker-u (NVIDIA Container Toolkit), ostalo radi i bez njega
          if timeout 180 docker run --rm --gpus all busybox:1.36 true >/dev/null 2>&1; then
            echo "COMPOSE_PROFILES=gpu" >> "$GITHUB_ENV"
            echo "Docker vidi GPU, generisanje slika ukljuceno" | tee -a pre.log
          else
            echo "COMPOSE_PROFILES=" >> "$GITHUB_ENV"
            echo "Docker NE vidi GPU (NVIDIA Container Toolkit), generisanje slika iskljuceno" | tee -a pre.log
          fi
          if V=$(curl -fsS --max-time 5 http://127.0.0.1:11434/api/version); then
            echo "Ollama $V" | tee -a pre.log
            # Modeli na serveru i trenutno ucitani u GPU (zajednicka Ollama za sve projekte)
            curl -fsS --max-time 5 http://127.0.0.1:11434/api/tags | grep -o '"name":"[^"]*"' | cut -d'"' -f4 | tr '\n' ' ' | sed 's/^/Modeli: /' | tee -a pre.log
            echo | tee -a pre.log
            curl -fsS --max-time 5 http://127.0.0.1:11434/api/ps | grep -oE '"name":"[^"]*"|"size_vram":[0-9]+' | paste - - | sed -E 's/"name":"([^"]*)"[[:space:]]+"size_vram":([0-9]+)/\1 \2/' | awk '{printf "Ucitano: %s %.1f GB VRAM\n", $1, $2/1e9}' | tee -a pre.log
          else
            echo "Ollama ne odgovara na 127.0.0.1:11434, AI ce raditi u rezervnom rezimu" | tee -a pre.log
          fi
          df -h / | tail -1 | tee -a pre.log
          free -g | head -2 | tee -a pre.log
          bash deploy/gh-annotate.sh notice "Server" pre.log

      - name: Priprema .env
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          DEMO_HOST: ${{ vars.DEMO_HOST }}
          WEB_PORT: ${{ vars.WEB_PORT }}
          OLLAMA_BASE_MODEL: ${{ vars.OLLAMA_BASE_MODEL }}
          LANGFUSE_HOST: ${{ vars.LANGFUSE_HOST }}
          LANGFUSE_UI_URL: ${{ vars.LANGFUSE_UI_URL }}
          LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
          LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
          DEMO_PASSWORD: ${{ secrets.DEMO_PASSWORD }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: |
          mkdir -p "$CONFIG_DIR"
          ENVF="$CONFIG_DIR/.env"
          set_env() {  # postavi ili dodaj KLJUC=vrednost
            if grep -q "^$1=" "$ENVF"; then sed -i "s|^$1=.*|$1=$2|" "$ENVF"; else echo "$1=$2" >> "$ENVF"; fi
          }
          if [ ! -f "$ENVF" ]; then
            cp .env.example "$ENVF"
            rnd() { openssl rand -hex "$1"; }
            set_env POSTGRES_PASSWORD "$(rnd 16)"
            set_env SECRET_KEY "$(rnd 32)"
            set_env LANGFUSE_NEXTAUTH_SECRET "$(rnd 32)"
            set_env LANGFUSE_SALT "$(rnd 16)"
            set_env LANGFUSE_ENCRYPTION_KEY "$(rnd 32)"
            set_env LANGFUSE_INIT_USER_PASSWORD "$(rnd 8)"
            set_env CLICKHOUSE_PASSWORD "$(rnd 12)"
            set_env MINIO_PASSWORD "$(rnd 12)"
            set_env REDIS_PASSWORD "$(rnd 12)"
            echo "Napravljen $ENVF sa nasumicnim lozinkama"
          fi
          # Kljucevi koji nedostaju u starijem .env dobijaju vrednost iz .env.example
          grep -E '^[A-Z_]+=' .env.example | while IFS= read -r line; do
            k="${line%%=*}"; grep -q "^$k=" "$ENVF" || echo "$line" >> "$ENVF"
          done
          # Vrednosti iz GitHub podesavanja uvek imaju prednost
          for k in HF_TOKEN DEMO_HOST WEB_PORT OLLAMA_BASE_MODEL LANGFUSE_HOST LANGFUSE_UI_URL LANGFUSE_PUBLIC_KEY LANGFUSE_SECRET_KEY DEMO_PASSWORD ADMIN_PASSWORD; do
            v="${!k}"
            [ -n "$v" ] && set_env "$k" "$v"
          done
          get_env() { grep -E "^$1=" "$ENVF" | head -1 | cut -d= -f2-; }
          # Javna adresa servera (za sertifikat i linkove) ako DEMO_HOST nije zadat
          if [ -z "$(get_env DEMO_HOST)" ] || [ "$(get_env DEMO_HOST)" = "localhost" ]; then
            IP=$(curl -fsS --max-time 5 https://api.ipify.org || true)
            [ -n "$IP" ] && set_env DEMO_HOST "$IP"
          fi
          # Lozinke za prijavu: iz GitHub tajni ili nasumicne (cuvaju se samo u .env na serveru)
          for k in DEMO_PASSWORD ADMIN_PASSWORD; do
            if [ -z "$(get_env $k)" ]; then set_env "$k" "$(openssl rand -base64 24 | tr -d '/+=' | cut -c1-16)"; fi
          done
          echo "::add-mask::$(get_env DEMO_HOST)"
          echo "::add-mask::$(get_env DEMO_PASSWORD)"
          echo "::add-mask::$(get_env ADMIN_PASSWORD)"
          chmod 600 "$ENVF"
          # Repozitorijum je javan: u log ne ide ni adresa servera ni lozinke
          grep -E '^(WEB_PORT|AI_MODE|LLM_BASE_URL|LLM_SERVED_NAME|OLLAMA_BASE_MODEL|LANGFUSE_HOST)=' "$ENVF" | tee cfg.log
          echo "DEMO_HOST: $( [ "$(get_env DEMO_HOST)" = "localhost" ] && echo 'NIJE postavljen' || echo 'postavljen')" | tee -a cfg.log
          echo "Lozinke: $( [ -n "$DEMO_PASSWORD" ] && echo 'iz GitHub tajni' || echo "u $ENVF na serveru")" | tee -a cfg.log
          if grep -q '^LANGFUSE_PUBLIC_KEY=.\+' "$ENVF"; then echo "Langfuse tragovi: ukljuceni"; else echo "Langfuse tragovi: iskljuceni (nema kljuceva)"; fi | tee -a cfg.log
          bash deploy/gh-annotate.sh notice "Konfiguracija" cfg.log

      - name: Provera porta
        run: |
          PORT=$(grep -E '^WEB_PORT=' "$CONFIG_DIR/.env" | cut -d= -f2)
          PORT=${PORT:-8090}
          OURS=$(docker compose --env-file "$CONFIG_DIR/.env" ps -q web 2>/dev/null || true)
          if [ -z "$OURS" ] && ss -ltnH "sport = :$PORT" | grep -q .; then
            echo "GRESKA: port $PORT je vec zauzet na serveru (drugi projekat). Promeniti promenljivu WEB_PORT."
            ss -ltnp "sport = :$PORT" || true
            exit 1
          fi
          echo "Port $PORT je slobodan ili ga vec koristi ovaj projekat"

      - name: Build
        run: docker compose --env-file "$CONFIG_DIR/.env" build --pull

      - name: Pokretanje
        run: |
          # Bez GPU-a u Docker-u ukloni kontejner za slike ostao od ranijeg pokusaja
          if [ -z "$COMPOSE_PROFILES" ]; then
            docker compose --env-file "$CONFIG_DIR/.env" --profile gpu rm -sf imagegen || true
          fi
          if docker compose --env-file "$CONFIG_DIR/.env" up -d --remove-orphans > up.log 2>&1; then
            cat up.log
            exit 0
          fi
          cat up.log
          bash deploy/gh-annotate.sh error "docker compose up" up.log 30
          docker compose --env-file "$CONFIG_DIR/.env" ps -a --format '{{.Service}} {{.State}} {{.Status}}' | tee ps.log
          bash deploy/gh-annotate.sh error "Stanje kontejnera" ps.log 40
          for svc in $(awk '$2!="running" && $0 !~ /\(0\)/ {print $1}' ps.log); do
            docker compose --env-file "$CONFIG_DIR/.env" logs --no-color --tail=40 "$svc" > "svc-$svc.log" 2>&1
            bash deploy/gh-annotate.sh error "Log $svc" "svc-$svc.log" 40
          done
          exit 1

      - name: Cekanje da aplikacija proradi
        run: |
          PORT=$(grep -E '^WEB_PORT=' "$CONFIG_DIR/.env" | cut -d= -f2)
          for i in $(seq 1 60); do
            if curl -kfsS "https://localhost:${PORT:-8090}/api/health" >/dev/null; then echo "Aplikacija radi"; exit 0; fi
            sleep 5
          done
          docker compose --env-file "$CONFIG_DIR/.env" logs --no-color --tail=80 api worker web | tee health.log
          bash deploy/gh-annotate.sh error "Aplikacija ne odgovara" health.log 40
          exit 1

      - name: Priprema jezickog modela u Ollama
        timeout-minutes: 45
        run: |
          # ollama-init preuzima model jednom (nekoliko GB), sledeci deploy-i traju par sekundi
          CID=$(docker compose --env-file "$CONFIG_DIR/.env" ps -aq ollama-init)
          while [ "$(docker inspect -f '{{.State.Status}}' "$CID")" = "running" ]; do sleep 10; done
          docker logs "$CID" > init.log 2>&1
          cat init.log
          CODE=$(docker inspect -f '{{.State.ExitCode}}' "$CID")
          if [ "$CODE" = "0" ]; then bash deploy/gh-annotate.sh notice "Ollama model" init.log 12
          else bash deploy/gh-annotate.sh error "Ollama model" init.log 20
          fi
          exit "$CODE"

      - name: Provera zastite pristupa
        run: |
          PORT=$(grep -E '^WEB_PORT=' "$CONFIG_DIR/.env" | cut -d= -f2)
          U="https://localhost:${PORT:-8090}"
          code() { curl -ks -o /dev/null -w '%{http_code}' "$@"; }
          ok=1
          chk() { if [ "$2" = "$3" ]; then echo "OK $1 ($2)" | tee -a zastita.log; else echo "GRESKA $1: dobijeno $2, ocekivano $3" | tee -a zastita.log; ok=0; fi; }
          : > zastita.log
          chk "HTTP preusmerava na HTTPS" "$(code "http://localhost:${PORT:-8090}/")" 301
          chk "API bez prijave" "$(code "$U/api/cases")" 401
          chk "Mailpit bez prijave" "$(code "$U/mailpit/")" 302
          chk "Slike bez prijave" "$(code "$U/media/social/x.png")" 302
          chk "Stara lozinka demo" "$(code -X POST -H 'Content-Type: application/json' -d '{"username":"jasmina","password":"demo"}' "$U/api/auth/login")" 401
          DP=$(grep -E '^DEMO_PASSWORD=' "$CONFIG_DIR/.env" | cut -d= -f2-)
          TOKEN=$(curl -ks -X POST -H 'Content-Type: application/json' -c jar.txt -d "{\"username\":\"jasmina\",\"password\":\"$DP\"}" "$U/api/auth/login" | grep -o '"token":"[^"]*"' | cut -d'"' -f4)
          chk "Prijava sa lozinkom iz .env" "$( [ -n "$TOKEN" ] && echo 200 || echo 401)" 200
          chk "API posle prijave" "$(code -H "Authorization: Bearer $TOKEN" "$U/api/cases")" 200
          chk "Mailpit posle prijave" "$(code -b jar.txt "$U/mailpit/")" 200
          rm -f jar.txt
          openssl s_client -connect "localhost:${PORT:-8090}" </dev/null 2>/dev/null | openssl x509 -noout -enddate | sed 's/^notAfter=/Sertifikat vazi do: /' | tee -a zastita.log
          if [ "$ok" = 1 ]; then bash deploy/gh-annotate.sh notice "Zastita pristupa" zastita.log; else bash deploy/gh-annotate.sh error "Zastita pristupa" zastita.log; fi
          [ "$ok" = 1 ]
        shell: bash

      - name: Provera AI obrade
        run: |
          # Radnik posle starta obradjuje pocetnu postu preko modela, ovde se vidi da li ide "live"
          sleep 90
          docker compose --env-file "$CONFIG_DIR/.env" exec -T db psql -U demo -d kcdemo -At -F ' | ' \
            -c "select 'poslovi', status, count(*) from jobs group by status order by status" \
            -c "select 'AI pozivi', mode, count(*), round(avg(latency_ms)/1000.0, 1) || ' s prosek', sum(case when ok then 0 else 1 end) || ' gresaka' from ai_calls where at > now() - interval '3 hours' group by mode" \
            -c "select 'greska', feature, left(error, 200) from ai_calls where not ok and at > now() - interval '3 hours' order by id desc limit 3" \
            > ai.log 2>&1 || true
          cat ai.log
          bash deploy/gh-annotate.sh notice "AI obrada" ai.log 20

      - name: Reset demo baze
        if: ${{ github.event.inputs.reset_demo == 'true' }}
        run: |
          docker compose --env-file "$CONFIG_DIR/.env" exec -T api python -c "from app.seed.seed import reset_database, seed_all; from app.db import SessionLocal; from app.seed.social_examples import seed_social_examples; reset_database(); db=SessionLocal(); print(seed_all(db)); seed_social_examples()"

      - name: Stanje servisa
        if: always()
        run: |
          docker compose --env-file "$CONFIG_DIR/.env" ps -a --format 'table {{.Service}}\t{{.State}}\t{{.Status}}' | tee ps-final.log
          bash deploy/gh-annotate.sh notice "Kontejneri" ps-final.log 40
          echo "Embedding, reranker i model za slike se pri prvom pokretanju preuzimaju sa Hugging Face-a (oko 20 GB),"
          echo "pa mogu biti spremni tek posle nekoliko minuta. Stanje se vidi u aplikaciji, Administracija, Stanje sistema."

      - name: Ciscenje starih slika ovog projekta
        if: success()
        run: docker image prune -f --filter "label=com.docker.compose.project=putevi-kc"
