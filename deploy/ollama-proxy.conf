# Prosledjivanje ka Ollama serveru na hostu preko UNIX socketa (vidi ollama-hostfwd)
upstream ollama_host {
    server unix:/sock/ollama.sock;
    keepalive 8;
}

server {
    listen 80;
    client_max_body_size 50m;

    # Zdravlje samog proxy-ja (Ollama se proverava posebno, da deploy ne pada ako je ona ugasena)
    location = /proxy-health {
        access_log off;
        return 200 "ok\n";
    }

    location / {
        proxy_pass http://ollama_host;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host localhost:11434;
        proxy_buffering off;
        # Prvi poziv posle pauze ucitava model u GPU, a preuzimanje modela traje dugo
        proxy_connect_timeout 10s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;
    }
}
