# Javni ulaz u demo: samo HTTPS (self-signed sertifikat, vidi 10-sertifikat.sh).
# Podaci su dostupni samo prijavljenim korisnicima: API proverava token, a slike (/media)
# i Mailpit (/mailpit) nginx pusta tek posle provere kolacica sesije (auth_request).

# Ogranicenje pokusaja prijave po IP adresi (zastita od pogadjanja lozinki)
limit_req_zone $binary_remote_addr zone=prijava:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;

server {
    listen 443 ssl;
    server_name _;
    root /usr/share/nginx/html;
    client_max_body_size 20m;
    server_tokens off;

    ssl_certificate /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;

    # Obican HTTP na HTTPS portu: preusmeri na https sa istom adresom i portom
    error_page 497 =301 https://$http_host$request_uri;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy same-origin always;

    location = /api/auth/login {
        limit_req zone=prijava burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://api:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /api/ {
        limit_req zone=api burst=60 nodelay;
        limit_req_status 429;
        proxy_pass http://api:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 600s;
    }

    # Interna provera sesije za auth_request
    location = /_auth {
        internal;
        proxy_pass http://api:8000/api/auth/check;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host $http_host;
        proxy_set_header Cookie $http_cookie;
    }

    location @prijava {
        return 302 /prijava;
    }

    location /media/ {
        auth_request /_auth;
        error_page 401 = @prijava;
        proxy_pass http://api:8000;
        proxy_set_header Host $http_host;
    }

    location /mailpit/ {
        auth_request /_auth;
        error_page 401 = @prijava;
        proxy_pass http://mailpit:8025/mailpit/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
    }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff always;
    }

    location / {
        try_files $uri /index.html;
    }
}
